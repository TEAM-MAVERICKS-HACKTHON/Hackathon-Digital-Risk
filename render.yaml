services:
  - type: web
    name: threatnexus-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://threatnexus.onrender.com
  - type: web
    name: threatnexus
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://threatnexus-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
